[package]
name = "radio-controllers"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-radio-controllers"
description = "Drivers for SBUS, IBUS, and Crossfire/ExpressLRS receivers."
keywords = ["sbus", "ibus", "crossfire", "express_lrs", "no_std"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::drones",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
#default = ["std", "serde"]
#default = ["serde"]
#default = ["rp2040"]
#default = ["rp235xa"]
#default = ["stm32"]
#default = ["esp32"]

# Core backend features declared explicitly
serde = ["dep:serde", "postcard", "simple-bitset/serde"]
storage = ["dep:sequential-storage", "serde", "simple-bitset/storage"]


[dependencies]
# Storage
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io", "experimental-derive"], optional = true }
sequential-storage = { version = "8.0.1", features = ["postcard"], optional = true }

simple-bitset = { version = "0.1.7", default-features = false }
#simple-bitset = { git = "https://github.com/martinbudden/crate-simple-bitset", default-features = false }
#simple-bitset = { path = "../simple-bitset", default-features = false }

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true

[workspace]
members = [
    ".",
    # "examples",
]
exclude = [
    "xtask",
]