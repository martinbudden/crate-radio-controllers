[package]
name = "radio-controllers"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-radio-controllers"
description = "Drivers for SBUS, IBUS, and Crossfire/ExpressLRS receivers."
keywords = ["sbus", "ibus", "crossfire", "express_lrs", "no_std"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::drones",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
#default = ["serde"]
serde = ["dep:serde", "postcard", "simple-bitset/serde"]
storage = ["dep:sequential-storage", "serde", "simple-bitset/storage"]

# Target platforms
host = []
std = ["embassy-time/std", "embassy-executor/platform-std"]
rp = ["dep:embassy-rp"] # combined feature for all rp variants
rp2040 = ["rp", "embassy-rp/rp2040"]
rp235xa = ["rp", "embassy-rp/rp235xa"]
rp235xb = ["rp", "embassy-rp/rp235xb"]
stm32 = [
    "dep:embassy-stm32",
    "embassy-stm32/time-driver-tim2",
    "embassy-executor/platform-cortex-m",   # <-- Explicitly satisfies the executor's platform check
    "embassy-executor/executor-thread",
]
stm32f405 = ["stm32", "embassy-stm32/stm32f405rg"]
esp32 = ["dep:esp-hal", "esp-hal/esp32s3"]

[dependencies]

# Core Embassy executor and concurrency primitives
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread"] }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false }

# Hardware-specific Embassy HAL
embassy-rp = { version = "0.10.0", default-features = false, optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true }
esp-hal = { version = "1.2.2", default-features = false, optional = true }
embedded-hal-nb = { version ="1.0.0", default-features = false }
embedded-hal = { version = "1.0.0", default-features = false }
nb = "1.1.0"

# Storage
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io", "experimental-derive"], optional = true }
sequential-storage = { version = "8.0.1", features = ["postcard"], optional = true }

simple-bitset = { version = "0.1.7", default-features = false }
#simple-bitset = { git = "https://github.com/martinbudden/crate-simple-bitset", default-features = false }
#simple-bitset = { path = "../simple-bitset", default-features = false }

[dev-dependencies]
# This allows 'cargo test' to work on a PC
embedded-hal-nb = "1.0.0"

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true

[workspace]
members = [
    ".",
    "xtask",
    "examples",
]
