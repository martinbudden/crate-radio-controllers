[package]
name = "radio-controllers-examples"
version = "0.1.0"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]

default = ["rp235xa"]

rp2040 = [
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp2040",
    "radio-controllers/rp2040"
]
rp235xa = [
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp235xa",
    "radio-controllers/rp235xa"
]
rp235xb = [
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp235xb",
    "radio-controllers/rp235xb"
]
stm32 = [
    "dep:embassy-stm32",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "cortex-m/critical-section-single-core",
    "embassy-executor/platform-cortex-m",
    "embassy-stm32/time-driver-tim2",
    "radio-controllers/stm32",
]
stm32f405 = ["embassy-stm32/stm32f405rg"]
esp32 = [
    "dep:esp-hal",
    "esp-hal/esp32s3",
    "radio-controllers/esp32"
]

[dependencies]
radio-controllers = { path = "..", default-features = false}

# Core Embassy executor and concurrency primitives
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread"] }
embassy-time = { version = "0.5.1", default-features = false }
# Hardware-specific Embassy HAL
embassy-rp = { version = "0.10.0", default-features = false, optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true }
#embedded-hal-bus = { version = "0.3.0", features = ["async"] }
esp-hal = { version = "1.2.2", default-features = false, optional = true }
cortex-m = { version = "0.7.9", default-features = false, optional = true }
cortex-m-rt = { version = "0.7.6" , default-features = false, optional = true }

fixed = "1.31.0"
defmt = { version = "1.0.1" }
defmt-rtt = "1.3.0"
defmt-test = "0.5.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = false
opt-level = 2

[[bin]]
name = "example1"
path = "src/example1.rs"

